name: Validate advanced Physics Lab
on:
  push:
    branches: [feat/advanced-physics]
    paths: [.github/workflows/source-review.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked source delta
        shell: python
        run: |
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = sorted(Path('.staging').glob('physics-part-*.txt'))
          assert len(parts) == 4
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'da216c8e234f37d4c16bd265a8f6517d6e0ab182bc2ee19069edd3e4cc5a6284'
          manifest = json.loads(raw)
          def safe(name):
              p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              return p
          def digest(text):
              return hashlib.sha256(text.encode()).hexdigest()
          changes = {}
          for name, patch in manifest['modifications'].items():
              p = safe(name)
              text = p.read_text()
              assert digest(text) == patch['sha256'], f'Baseline differs: {name}'
              for start, end, replacement in reversed(patch['ops']):
                  text = text[:start] + replacement + text[end:]
              assert digest(text) == patch['result'], f'Result differs: {name}'
              changes[p] = text
          for name, text in manifest['files'].items():
              p = safe(name)
              assert not p.exists(), f'New file already exists: {name}'
              changes[p] = text
          for p, text in changes.items():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)
          for name in manifest['delete']:
              safe(name).unlink()
          for p in parts:
              p.unlink()
          Path('.staging').rmdir()
          print(f'Applied {len(changes)} checked source files')
      - name: Commit decoded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add ten researched advanced physics laboratories'
          git push origin HEAD:feat/advanced-physics
          git archive --format=tar HEAD > /tmp/physics-source.tar
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify physics
        run: pnpm test
      - name: Typecheck and build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-browser-evidence
          path: |
            test-results/
            playwright-report/
            /tmp/physics-source.tar
          retention-days: 7
