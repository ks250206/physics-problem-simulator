name: Source review snapshot
on:
  push:
    branches: [feat/advanced-physics]
    paths: [.github/workflows/source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source-review
          path: source.tar
          retention-days: 1
